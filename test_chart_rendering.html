<!DOCTYPE html>
<html>
<head>
  <title>Chart Rendering Test</title>
  <style>
    body { padding: 20px; font-family: sans-serif; }
    canvas { border: 1px solid #ccc; display: block; margin: 20px 0; }
    .info { background: #f0f0f0; padding: 10px; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>Scoreboard Chart Rendering Test</h1>
  
  <div class="info">
    <strong>Testing:</strong>
    <ul>
      <li>✓ HiDPI rendering (devicePixelRatio)</li>
      <li>✓ Y-axis readable text (textBaseline: middle)</li>
      <li>✓ X-axis real dates (not all 12/31)</li>
      <li>✓ Hover crosshair + tooltip</li>
    </ul>
  </div>
  
  <div>
    <label><input type="checkbox" id="ma20" checked> MA20 (Green)</label>
    <label><input type="checkbox" id="ma50" checked> MA50 (Orange)</label>
    <label><input type="checkbox" id="volume" checked> Volume</label>
  </div>
  
  <canvas id="test-chart" width="800" height="400"></canvas>
  
  <div class="info" id="mouse-info">Hover over chart to see tooltip</div>
  
  <script type="module">
    const canvas = document.getElementById('test-chart');
    const ctx = canvas.getContext('2d');
    
    // Generate test data
    const now = Date.now();
    const day = 86400000;
    const data = Array.from({ length: 30 }, (_, i) => {
      const base = 65000 + Math.sin(i / 5) * 5000 + Math.random() * 2000;
      return {
        timestamp: now - (29 - i) * day,
        close: base,
        volume: 1000000 + Math.random() * 500000,
        ma20: i >= 19 ? base * 0.98 : null,
        ma50: null
      };
    });
    
    // Setup HiDPI canvas
    function setupCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      return { width: rect.width, height: rect.height, dpr };
    }
    
    function render() {
      const { width, height } = setupCanvas();
      ctx.clearRect(0, 0, width, height);
      
      const padding = { top: 20, right: 80, bottom: 60, left: 70 };
      const chartWidth = width - padding.left - padding.right;
      const chartHeight = height - padding.top - padding.bottom - 80;
      
      const closes = data.map(d => d.close);
      const minPrice = Math.min(...closes) * 0.98;
      const maxPrice = Math.max(...closes) * 1.02;
      const xStep = chartWidth / (data.length - 1);
      
      const priceToY = (price) => {
        return padding.top + chartHeight - ((price - minPrice) / (maxPrice - minPrice)) * chartHeight;
      };
      
      // Grid + Y-axis
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 5; i++) {
        const y = padding.top + (chartHeight / 5) * i;
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(width - padding.right, y);
        ctx.stroke();
        
        const price = maxPrice - ((maxPrice - minPrice) / 5) * i;
        ctx.fillStyle = '#666';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(price.toFixed(0), padding.left - 10, y);
      }
      
      // Price line
      ctx.strokeStyle = '#667eea';
      ctx.lineWidth = 2;
      ctx.beginPath();
      data.forEach((point, i) => {
        const x = padding.left + i * xStep;
        const y = priceToY(point.close);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
      
      // MA20
      if (document.getElementById('ma20').checked) {
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 2;
        ctx.beginPath();
        let started = false;
        data.forEach((point, i) => {
          if (point.ma20) {
            const x = padding.left + i * xStep;
            const y = priceToY(point.ma20);
            if (!started) {
              ctx.moveTo(x, y);
              started = true;
            } else {
              ctx.lineTo(x, y);
            }
          }
        });
        ctx.stroke();
      }
      
      // X-axis dates
      ctx.fillStyle = '#333';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      const dateStep = Math.max(1, Math.floor(data.length / 8));
      for (let i = 0; i < data.length; i += dateStep) {
        const x = padding.left + i * xStep;
        const date = new Date(data[i].timestamp);
        const label = `${date.getMonth() + 1}/${date.getDate()}`;
        ctx.fillText(label, x, height - 30);
      }
      
      // Volume
      if (document.getElementById('volume').checked) {
        const volumeTop = height - 80;
        const volumeHeight = 60;
        const maxVol = Math.max(...data.map(d => d.volume));
        
        data.forEach((point, i) => {
          const x = padding.left + i * xStep;
          const h = (point.volume / maxVol) * volumeHeight;
          ctx.fillStyle = 'rgba(102, 126, 234, 0.3)';
          ctx.fillRect(x - xStep / 3, volumeTop + volumeHeight - h, xStep / 1.5, h);
        });
      }
    }
    
    document.getElementById('ma20').addEventListener('change', render);
    document.getElementById('ma50').addEventListener('change', render);
    document.getElementById('volume').addEventListener('change', render);
    
    render();
    
    console.log('✓ Chart rendered with:', {
      dpr: window.devicePixelRatio,
      dataPoints: data.length,
      firstDate: new Date(data[0].timestamp).toLocaleDateString(),
      lastDate: new Date(data[data.length-1].timestamp).toLocaleDateString()
    });
  </script>
</body>
</html>
