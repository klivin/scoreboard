<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoreboard - Crypto Analysis & Forecasting</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Scoreboard</h1>
      <p class="subtitle">Crypto Market Analysis & Forecasting Dashboard</p>
    </header>

    <div id="missing-alert" class="alert hidden"></div>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="overview">Overview</button>
      <button class="tab-btn" data-tab="forecast">Forecasts</button>
      <button class="tab-btn" data-tab="universe">Universe</button>
      <button class="tab-btn" data-tab="investments">Investments</button>
    </nav>

    <div id="overview" class="tab-content active">
      <div class="controls">
        <label>
          Symbol:
          <select id="symbol-select">
            <option value="AVAX">AVAX</option>
            <option value="BNB">BNB</option>
            <option value="BTC" selected>BTC</option>
            <option value="DOGE">DOGE</option>
            <option value="ETH">ETH</option>
            <option value="LINK">LINK</option>
            <option value="PEPE">PEPE</option>
            <option value="SHIB">SHIB</option>
            <option value="SOL">SOL</option>
            <option value="SUI">SUI</option>
            <option value="TRUMP">TRUMP</option>
            <option value="XRP">XRP</option>
          </select>
        </label>
        <label>
          Interval:
          <select id="interval-select">
            <option value="1h">1 Hour</option>
            <option value="1d" selected>1 Day</option>
          </select>
        </label>
        <button id="load-btn">Load Data</button>
        <button id="download-csv-btn">Download CSV</button>
      </div>
      <div id="refresh-status" class="refresh-status hidden" aria-live="polite"></div>

      <div id="chart-container">
        <h2>Price Chart</h2>
        <div class="chart-controls">
          <label><input type="checkbox" id="toggle-ma20" checked> MA20 (EMA)</label>
          <label><input type="checkbox" id="toggle-ma50" checked> MA50 (SMA)</label>
          <label><input type="checkbox" id="toggle-ma100"> MA100 (SMA)</label>
          <label><input type="checkbox" id="toggle-ma200"> MA200 (SMA)</label>
          <label><input type="checkbox" id="toggle-ichimoku"> Ichimoku Cloud</label>
          <label><input type="checkbox" id="toggle-volume" checked> Volume</label>
          <label><input type="checkbox" id="toggle-etf"> ETF net flow</label>
          <label title="OKX open interest (contracts). Short interest is not in the Flow pack."><input type="checkbox" id="toggle-oi"> Open Interest</label>
          <label><input type="checkbox" id="toggle-predicted"> Predicted</label>
          <label><input type="checkbox" id="toggle-actual"> Actual</label>
          <label><input type="checkbox" id="toggle-naive" checked> Naive Baseline</label>
        </div>
        <div class="signal-controls">
          <span class="signal-controls-title">Signal engine <em>(research only)</em>:</span>
          <label>
            Horizon:
            <select id="signal-horizon-select">
              <option value="weekly" selected>Weekly</option>
              <option value="monthly">Monthly</option>
            </select>
          </label>
          <label><input type="checkbox" id="toggle-signal-ema-crossover" checked> EMA cross</label>
          <label><input type="checkbox" id="toggle-signal-macd-cross" checked> MACD</label>
          <label><input type="checkbox" id="toggle-signal-rsi-recovery" checked> RSI recovery</label>
          <label><input type="checkbox" id="toggle-signal-ichimoku" checked> Ichimoku</label>
        </div>
        <div class="chart-toolbar">
          <button type="button" class="tool-btn active" data-draw-mode="cursor">Cursor</button>
          <button type="button" class="tool-btn" data-draw-mode="horizontal">Horizontal</button>
          <button type="button" class="tool-btn" data-draw-mode="trend">Trend</button>
          <button type="button" id="clear-drawings-btn">Clear drawings</button>
          <button type="button" id="reset-viewport-btn">Last few days</button>
          <button type="button" id="fit-all-btn">Fit all</button>
        </div>
        <div id="chart-wrap">
          <div id="chart"></div>
          <div id="chart-tooltip" class="chart-tooltip hidden"></div>
          <div id="chart-empty" class="chart-empty hidden"></div>
        </div>
        <div id="chart-day-strip" class="chart-day-strip hidden"></div>
        <div id="signal-detail-strip" class="signal-detail-strip hidden"></div>
        <div id="investment-detail-strip" class="investment-detail-strip hidden"></div>
      </div>

      <div id="signals-container">
        <h2>Market Signals</h2>
        <div id="signals-grid" class="stats-grid"></div>
      </div>

      <div id="stats-container" class="stats-grid"></div>
    </div>

    <div id="forecast" class="tab-content">
      <div class="forecast-controls">
        <label>
          Horizon (days):
          <select id="horizon-select">
            <option value="1">1 Day</option>
            <option value="7" selected>7 Days</option>
            <option value="30">30 Days</option>
          </select>
        </label>
        <button id="generate-forecast-btn">Generate Forecast</button>
      </div>

      <div id="forecast-cards" class="forecast-grid"></div>
    </div>

    <div id="universe" class="tab-content">
    </div>

    <div id="investments" class="tab-content">
    </div>
  </div>

  <script src="/vendor/lightweight-charts/lightweight-charts.standalone.production.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
